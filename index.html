  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f7f5f2;
      --surface:      #ffffff;
      --border:       #e8e3dc;
      --text:         #1a1714;
      --muted:        #8c867e;
      --accent:       #2d5a3d;
      --accent-light: #edf3ef;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
    }

    /* HEADER */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.4rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem; letter-spacing: .06em;
    }
    .ar-chip {
      display: flex; align-items: center; gap: .35rem;
      background: var(--accent); color: #fff;
      font-size: .65rem; font-weight: 500;
      letter-spacing: .14em; text-transform: uppercase;
      padding: .3rem .75rem; border-radius: 2px;
    }
    .ar-chip svg { width: 12px; height: 12px; fill: #fff; }

    /* HERO */
    .hero {
      padding: 2.2rem 1.4rem 1.4rem;
      text-align: center;
    }
    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      line-height: 1.15; margin-bottom: .6rem;
    }
    .hero h1 em { font-style: italic; }
    .hero p {
      font-size: .88rem; line-height: 1.7;
      color: var(--muted);
      max-width: 320px; margin: 0 auto 1.3rem;
    }
    .steps {
      display: inline-flex; gap: 1rem;
      background: var(--accent-light);
      padding: .65rem 1.1rem; border-radius: 4px;
      font-size: .76rem; color: var(--accent);
    }
    .step { display: flex; align-items: center; gap: .3rem; }
    .sn {
      width: 17px; height: 17px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: .62rem; font-weight: 500;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* LIST */
    .list {
      padding: .6rem 1.2rem 3rem;
      display: flex; flex-direction: column; gap: .85rem;
      max-width: 540px; margin: 0 auto;
    }

    /* CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex; overflow: hidden;
      text-decoration: none; color: inherit;
      opacity: 0; transform: translateY(12px);
      animation: up .45s ease forwards;
      transition: box-shadow .2s;
    }
    .card:nth-child(1){animation-delay:.04s}
    .card:nth-child(2){animation-delay:.10s}
    .card:nth-child(3){animation-delay:.16s}
    .card:nth-child(4){animation-delay:.22s}
    .card:nth-child(5){animation-delay:.28s}
    .card:nth-child(6){animation-delay:.34s}
    .card:active { box-shadow: 0 0 0 2px var(--accent); }

    .card-img {
      width: 110px; flex-shrink: 0;
      background: var(--bg); overflow: hidden;
    }
    .card-img img {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
      transition: transform .35s ease;
    }
    .card:hover .card-img img { transform: scale(1.06); }

    .card-body {
      flex: 1; padding: .9rem;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .card-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem; margin-bottom: .15rem;
    }
    .card-sub { font-size: .74rem; color: var(--muted); }

    .card-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: .7rem;
    }
    .card-price { font-size: .88rem; font-weight: 500; }

    .btn-ar {
      display: inline-flex; align-items: center; gap: .34rem;
      background: var(--accent); color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: .68rem; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase;
      padding: .42rem .85rem; border-radius: 3px;
      border: none; cursor: pointer; text-decoration: none;
      transition: background .2s, transform .12s;
      white-space: nowrap;
    }
    .btn-ar:active { transform: scale(.95); }
    .btn-ar svg { width: 13px; height: 13px; fill: #fff; flex-shrink: 0; }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 1.8rem 1.4rem 2.4rem;
      font-size: .74rem; color: var(--muted);
      border-top: 1px solid var(--border);
    }

    @keyframes up {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 560px) {
      .card-img { width: 150px; }
    }
  </style>

<script>

  const list = document.getElementById('list');

  products.forEach(p => {
    // Toàn bộ card là link → tap ở đâu cũng vào AR
    const a = document.createElement('a');
    a.className = 'card';
    a.href = p.ar_url;

    a.rel = 'noopener noreferrer';

    a.innerHTML = `

    // GA4: ghi nhận khi nhấn

    list.appendChild(a);
  });
</script>
